<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login · MCP Gateway</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

  body {
    background:
      radial-gradient(ellipse 800px 600px at 20% 30%, rgba(99, 102, 241, 0.08), transparent 70%),
      radial-gradient(ellipse 600px 800px at 80% 70%, rgba(168, 85, 247, 0.06), transparent 70%),
      radial-gradient(ellipse 1000px 500px at 50% 100%, rgba(59, 130, 246, 0.05), transparent 80%),
      linear-gradient(180deg, #080316 0%, #0C0720 50%, #080418 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: #F5F3FF;
    overflow-x: hidden;
  }

  /* 漂浮光斑 */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.22;
    pointer-events: none;
    animation: float 12s ease-in-out infinite;
  }
  .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, #6366F1 0%, transparent 70%); top: -100px; left: -100px; }
  .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #A855F7 0%, transparent 70%); top: 30%; right: -150px; animation-delay: -4s; }
  .orb-3 { width: 350px; height: 350px; background: radial-gradient(circle, #3B82F6 0%, transparent 70%); bottom: -100px; left: 30%; animation-delay: -8s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 30px) scale(0.95); }
  }

  /* 玻璃卡片 */
  .glass {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.05) inset,
      0 20px 60px -10px rgba(0, 0, 0, 0.5),
      0 0 80px rgba(99, 102, 241, 0.15);
  }

  .glass-subtle {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  /* 渐变文字 */
  .text-gradient {
    background: linear-gradient(135deg, #FFFFFF 0%, #C4B5FD 50%, #A78BFA 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .text-gradient-accent {
    background: linear-gradient(135deg, #A78BFA 0%, #6366F1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* 输入框 */
  .input-vp {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .input-vp:focus {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(167, 139, 250, 0.5);
    box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1), 0 0 20px rgba(167, 139, 250, 0.2);
    outline: none;
  }

  /* 按钮 */
  .btn-vp {
    background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.1) inset,
      0 8px 24px -4px rgba(99, 102, 241, 0.5),
      0 0 40px rgba(139, 92, 246, 0.3);
    transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn-vp:hover {
    transform: translateY(-1px);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.15) inset,
      0 12px 32px -4px rgba(99, 102, 241, 0.6),
      0 0 60px rgba(139, 92, 246, 0.5);
  }
  .btn-vp:active { transform: translateY(0); }

  /* 3D 倾斜 */
  .tilt-3d { transform: perspective(1200px) rotateX(2deg) rotateY(-3deg); transition: transform 400ms cubic-bezier(0.4, 0, 0.2, 1); }
  .tilt-3d:hover { transform: perspective(1200px) rotateX(0deg) rotateY(0deg); }

  /* 网格背景 */
  .grid-bg {
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* 扫描线高光 */
  .shine { position: relative; overflow: hidden; }
  .shine::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine { 0% { left: -100%; } 100% { left: 200%; } }
</style>
</head>
<body class="flex items-center justify-center p-6 relative">

  <!-- 光斑 -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- 网格背景 -->
  <div class="fixed inset-0 grid-bg pointer-events-none opacity-50"></div>

  <!-- 登录卡片 -->
  <div class="relative z-10 w-full max-w-md">

    <!-- 品牌区 -->
    <div class="flex flex-col items-center mb-10">
      <div class="relative w-20 h-20 mb-6">
        <div class="absolute inset-0 bg-gradient-to-br from-violet-500 to-indigo-600 rounded-2xl rotate-6 blur-xl opacity-60"></div>
        <div class="relative w-full h-full bg-gradient-to-br from-violet-500/90 to-indigo-600/90 rounded-2xl flex items-center justify-center glass">
          <span class="mono text-white text-[24px] font-bold tracking-tighter">M</span>
        </div>
      </div>
      <h1 class="text-[40px] font-bold tracking-tight text-gradient mb-2">mcp-proxy</h1>
      <p class="text-[13px] text-violet-200/60 tracking-wide">Model Context Protocol Gateway</p>
    </div>

    <!-- 登录表单 -->
    <div class="glass rounded-3xl p-8 tilt-3d">
      <div class="mb-6">
        <h2 class="text-[22px] font-semibold text-white mb-1.5">欢迎回来</h2>
        <p class="text-[13px] text-violet-200/60">输入访问令牌以进入控制台</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-[11px] font-medium uppercase tracking-[0.15em] text-violet-200/70 mb-2">Access Token</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-violet-300/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input
              type="password"
              placeholder="••••••••••••••••"
              class="input-vp w-full h-12 pl-11 pr-4 rounded-xl text-[14px] text-white placeholder-violet-300/30 mono"
            />
          </div>
        </div>

        <div class="flex items-center justify-between text-[12px]">
          <label class="flex items-center gap-2 text-violet-200/60 cursor-pointer">
            <input type="checkbox" class="w-3.5 h-3.5 rounded border-violet-300/30 bg-transparent" />
            <span>在此设备记住我</span>
          </label>
          <a href="#" class="text-violet-300 hover:text-violet-200 transition-colors">忘记令牌？</a>
        </div>

        <button class="btn-vp w-full h-12 rounded-xl text-white text-[14px] font-semibold mt-2 flex items-center justify-center gap-2">
          <span>验证并进入</span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>

      <!-- 分割 -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-gradient-to-r from-transparent to-white/10"></div>
        <span class="text-[10px] uppercase tracking-[0.2em] text-violet-200/40">安全连接</span>
        <div class="flex-1 h-px bg-gradient-to-l from-transparent to-white/10"></div>
      </div>

      <div class="flex items-center justify-center gap-6 text-[11px] text-violet-200/50">
        <div class="flex items-center gap-1.5">
          <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-lg shadow-emerald-400/50"></div>
          <span>TLS 加密</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-lg shadow-emerald-400/50"></div>
          <span>本地代理</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-lg shadow-emerald-400/50"></div>
          <span>v1.0.0</span>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <p class="text-center mt-8 text-[11px] text-violet-200/40">
      没有令牌？<a href="#" class="text-violet-300 hover:text-white transition-colors ml-1">查看文档</a>
    </p>
  </div>
</body>
</html>
